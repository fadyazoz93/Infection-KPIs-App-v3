<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Shield Base (Infection Control & Protection) -->
  <path d="M32 9 L48 15 C48 29 41 43 32 51 C23 43 16 29 16 15 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield Inner Accent Edge -->
  <path d="M32 12 L45 17.5 C45 28.5 39 40 32 47.5 C25 40 19 28.5 19 17.5 Z" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Medical Cross Accent (Top Right behind check) -->
  <path d="M30 17 H34 V35 H30 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M23 24 H41 V28 H23 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Golden / Emerald KPI Checkmark (Compliance & High Quality) -->
  <circle cx="37" cy="35" r="13" fill="#1e1b4b" stroke="#34d399" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M30 35 L35 40 L45 30" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle KPI Performance Pulse Dots -->
  <circle cx="12" cy="52" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="19" cy="52" r="2.5" fill="#34d399" opacity="0.9"/>
  <circle cx="26" cy="52" r="2" fill="#38bdf8" opacity="0.8"/>
</svg>
